[package]
name = "gpt2_bench"
version = "0.1.0"
edition = "2021"

[lib]
name = "gpt2_bench"
path = "src/lib.rs"

[[bin]]
name = "bench"
path = "src/bin/bench.rs"

[[bin]]
name = "worker"
path = "src/bin/worker.rs"

[dependencies]
gpt2_engine = { path = "../engine" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.133"
